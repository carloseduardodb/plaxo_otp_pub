name: 'Release Build'

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Credenciais do Google OAuth, embutidas em tempo de compilação.
          # Configure-as em Settings > Secrets and variables > Actions.
          # Sem elas o build funciona; apenas o sync fica desabilitado.
          PLAXO_GOOGLE_CLIENT_ID: ${{ secrets.PLAXO_GOOGLE_CLIENT_ID }}
          PLAXO_GOOGLE_CLIENT_SECRET: ${{ secrets.PLAXO_GOOGLE_CLIENT_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Plaxo OTP ${{ github.ref_name }}'
          releaseBody: |
            **Plaxo OTP** — gerador de códigos TOTP para desktop, com cofre local
            cifrado por senha mestre.

            ## Downloads
            - **Windows**: `.msi`
            - **macOS**: `.dmg` (Intel e Apple Silicon)
            - **Linux**: `.deb` e `.AppImage`

            ## Instalação
            1. Baixe o arquivo do seu sistema
            2. Execute o instalador
            3. Abra o Plaxo OTP pela bandeja do sistema
            4. Defina sua senha mestre

            > Os instaladores **não são assinados**. O Windows exibe um aviso do
            > SmartScreen e o macOS exige liberar o app em Ajustes > Privacidade e
            > Segurança. Compile você mesmo se preferir não confiar no binário.

            ## Segurança
            - Cofre cifrado com AES-256-GCM (cifragem autenticada)
            - Chave derivada com Argon2id e salt aleatório por cofre
            - A senha mestre não é gravada em disco nem retida em memória
            - O backup enviado ao Google Drive vai cifrado, sem a chave

            Limitações conhecidas (malware local, senha mestre fraca, binários não
            assinados, ausência de auditoria externa) estão descritas em
            [SECURITY.md](https://github.com/${{ github.repository }}/blob/main/SECURITY.md).

            ## Atualizando de uma versão anterior
            Cofres da 1.3.3 ou anterior são migrados automaticamente no primeiro
            desbloqueio; o arquivo antigo é preservado como `apps.enc.backup`.
            Aquelas versões usavam uma derivação de chave fraca, então **considere
            trocar a senha mestre** após atualizar.

            Detalhes no [README](https://github.com/${{ github.repository }}).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
