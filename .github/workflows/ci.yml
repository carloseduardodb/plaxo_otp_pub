name: 'CI'

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint TypeScript
        run: npx tsc --noEmit

      - name: Build frontend
        run: |
          npm run build
          ls -la dist/

      - name: Check Rust code
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Ensure no Google credentials are committed
        run: |
          # O padrão é montado em tempo de execução para que este próprio
          # arquivo não case com ele.
          pattern="GOCSPX""-|[0-9]{10,12}-[a-z0-9]{32}\.apps\.googleusercontent\.com"
          if grep -rInE "$pattern" \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=target .; then
            echo "::error::Credencial do Google encontrada no repositorio"
            exit 1
          fi
          echo "Nenhuma credencial encontrada"

      - name: Test Tauri build
        run: |
          cd src-tauri
          pwd
          ls -la ../dist/ || echo "dist not found"
          cargo build
